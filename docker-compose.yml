version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: vlivechat_postgres
    environment:
      POSTGRES_DB: vlivechat
      POSTGRES_USER: vlcuser
      POSTGRES_PASSWORD: vlcpassword123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlcuser -d vlivechat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vlivechat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
